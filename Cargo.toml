[package]
name = "calinator"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A modern terminal calendar"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
crossterm = "0.29"
keyring-core = "1"
musinator-themes = { path = "crates/themes" }
ratatui = "0.30"
roxmltree = "0.21.2"
rrule = "0.14.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ulid = "3.0.0"
unicode-width = "0.2.3"
ureq = "3"
zbus = "5"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[workspace]
members = [".", "crates/themes"]
